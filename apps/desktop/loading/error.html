<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevDock</title>
    <link rel="stylesheet" href="error.css" />
    <script src="error.js" defer></script>
  </head>
  <body>
    <main>
      <h1>DevDock could not start</h1>
      <p id="message" role="alert">Something went wrong.</p>
      <div class="actions">
        <button id="retry" type="button">Try again</button>
        <button id="close" type="button" class="secondary">Close</button>
      </div>
    </main>
  </body>
</html>
