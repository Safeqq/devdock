name: Platform spike

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contract:
    name: Platform contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record runner platform
        run: node scripts/print-platform.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run check:toolchain
      - run: npm run check:versions
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run package:local
      - run: npm run verify:artifact
      - run: npm run verify:reproducible
      - run: npm run package:sbom
      - run: npm run verify:sbom
      - run: npm run package:licenses
      - run: npm run verify:licenses
      - run: npm run test:browser

  desktop-installer:
    name: Desktop installer (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
      - run: npm ci --no-audit --no-fund
      - run: npm run check:toolchain
      - run: npm run check:versions
      - name: Build the installer
        run: npm run desktop:bundle
      # On this runner the installed app starts but never opens its window or engine (cause not
      # yet known), so CI runs the installed engine directly; `npm run desktop:verify-installer`
      # without the flag covers the window locally. This step records the session and WebView2.
      - name: Record the runner session and WebView2 runtime
        run: |
          "session $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive $([Environment]::UserInteractive)"
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 $((Get-ItemProperty $key).pv)" } else { "WebView2 missing" }
      - name: Install, run the installed engine, and uninstall
        run: npm run desktop:verify-installer -- --engine-only
      # Diagnostic only until the window opens on this runner: prints the shell's startup trace,
      # its windows, and its processes when the window does not appear.
      - name: Try the installed app's window
        continue-on-error: true
        run: npm run desktop:verify-installer
